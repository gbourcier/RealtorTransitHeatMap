openapi: 3.0.3
info:
  title: RealtorTransitHeatMap API
  version: 0.1.0
  description: >-
    Internal API for triggering scrape runs and managing recurring scrape
    schedules. Default bind address is 127.0.0.1:3000 (HTTP_ADDR env var).

servers:
  - url: http://127.0.0.1:3000
    description: Local dev

tags:
  - name: scrapes
    description: Manually trigger and inspect scrape runs
  - name: schedules
    description: CRUD on recurring scrape schedules (cron-driven)
  - name: listings
    description: Browse scraped property listings
  - name: transit
    description: Trigger transit commute-time computation

paths:
  /api/scrapes:
    get:
      tags: [scrapes]
      summary: List scrape runs
      description: Returns scrape runs newest-first.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - in: query
          name: status
          required: false
          description: Filter by run status.
          schema:
            type: string
            enum: [running, success, error]
        - in: query
          name: scheduleId
          required: false
          description: Filter by triggering schedule id.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Paginated scrape runs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedScrapeRuns" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [scrapes]
      summary: Start a manual scrape
      description: >-
        Kicks off a scrape in the background and returns the run id.
        Returns 409 if a scrape is already in flight (single-flight worker).
      responses:
        "202":
          description: Scrape accepted; runId returned for polling.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StartScrapeResponse" }
        "409":
          description: A scrape is already in progress.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          $ref: "#/components/responses/InternalError"

  /api/scrapes/{id}:
    get:
      tags: [scrapes]
      summary: Get a scrape run by id
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: The scrape run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScrapeRun" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/schedules:
    get:
      tags: [schedules]
      summary: List schedules
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - in: query
          name: enabled
          required: false
          description: Filter by enabled flag. Omit for all.
          schema:
            type: boolean
      responses:
        "200":
          description: Paginated schedules.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedSchedules" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [schedules]
      summary: Create a schedule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateScheduleRequest" }
            examples:
              every-six-hours:
                summary: Every 6 hours
                value:
                  name: realtor-6h
                  cronExpr: "0 */6 * * *"
                  enabled: true
              weekday-9am-utc:
                summary: Weekdays 09:00 UTC
                value:
                  name: realtor-weekday-morning
                  cronExpr: "0 9 * * 1-5"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/schedules/{id}:
    get:
      tags: [schedules]
      summary: Get a schedule by id
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: The schedule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [schedules]
      summary: Update a schedule (partial)
      description: All fields optional; omitted fields are left unchanged.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateScheduleRequest" }
            examples:
              disable:
                summary: Disable a schedule
                value: { enabled: false }
              change-cron:
                summary: Change cadence
                value: { cronExpr: "0 */12 * * *" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [schedules]
      summary: Delete a schedule
      description: >-
        Deleting a schedule sets schedule_id=NULL on its historical scrape_runs
        rows (history is preserved).
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/listings:
    get:
      tags: [listings]
      summary: List listings
      description: Returns scraped property listings newest-first by default.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - in: query
          name: sortBy
          required: false
          description: Field to sort by (default first_seen_at).
          schema:
            type: string
            enum: [price, first_seen_at]
            default: first_seen_at
        - in: query
          name: sortDir
          required: false
          description: Sort direction (default desc).
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - in: query
          name: maxPrice
          required: false
          description: Only include listings whose current price is at most this value (CAD).
          schema:
            type: number
            minimum: 0
        - in: query
          name: maxCommuteSec
          required: false
          description: Only include listings whose commute to downtown is at most this many seconds.
          schema:
            type: integer
            minimum: 0
        - in: query
          name: newWithinDays
          required: false
          description: Only include listings first seen within the last N days.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Paginated listings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedListings" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/listings/{board}/{mls}:
    get:
      tags: [listings]
      summary: Get a listing by board and MLS number
      parameters:
        - $ref: "#/components/parameters/BoardPath"
        - $ref: "#/components/parameters/MLSPath"
      responses:
        "200":
          description: The listing with full price history.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListingDetail" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/transit/compute:
    post:
      tags: [transit]
      summary: Start transit computation for all listings
      description: >-
        Kicks off a background job that computes transit commute times for every
        listing that does not yet have one. Returns 409 if a computation is
        already running, or 424 if no transit stops have been loaded yet
        (run gtfs-precompute first).
      parameters:
        - in: query
          name: refresh
          required: false
          description: Recompute even for listings that already have a commute time.
          schema:
            type: boolean
            default: false
      responses:
        "202":
          description: Computation accepted and started in the background.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransitComputeResponse" }
        "409":
          description: Transit computation already in progress.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "424":
          $ref: "#/components/responses/FailedDependency"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/transit/compute/{board}/{mls}:
    post:
      tags: [transit]
      summary: Compute transit time for a single listing
      parameters:
        - $ref: "#/components/parameters/BoardPath"
        - $ref: "#/components/parameters/MLSPath"
        - in: query
          name: refresh
          required: false
          description: Recompute even if a commute time already exists.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Computation complete.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransitComputeOneResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "424":
          $ref: "#/components/responses/FailedDependency"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  parameters:
    IdPath:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    BoardPath:
      in: path
      name: board
      required: true
      description: Board number.
      schema:
        type: integer
    MLSPath:
      in: path
      name: mls
      required: true
      description: MLS number.
      schema:
        type: integer
    Limit:
      in: query
      name: limit
      required: false
      description: Max items per page (1-200, default 50).
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Offset:
      in: query
      name: offset
      required: false
      description: Items to skip (default 0).
      schema:
        type: integer
        minimum: 0
        default: 0

  responses:
    BadRequest:
      description: Bad request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: Internal server error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    FailedDependency:
      description: A required dependency is missing (e.g. transit stops not loaded).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    StartScrapeResponse:
      type: object
      required: [runId]
      properties:
        runId:
          type: string
          format: uuid

    ScrapeRun:
      type: object
      required: [id, source, status, startedAt]
      properties:
        id:
          type: string
          format: uuid
        source:
          type: string
          example: realtor.ca
        status:
          type: string
          enum: [running, success, error]
        startedAt:
          type: integer
          format: int64
          description: Unix seconds.
        completedAt:
          type: integer
          format: int64
          nullable: true
        totalCount:
          type: integer
          nullable: true
        newCount:
          type: integer
          nullable: true
        errorKind:
          type: string
          enum: [forbidden, null_count, unknown]
        errorMessage:
          type: string
        scheduleId:
          type: string
          format: uuid
          nullable: true
          description: Set when the run was triggered by a schedule; null for manual triggers.

    Schedule:
      type: object
      required: [id, name, cronExpr, enabled, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        cronExpr:
          type: string
          description: 5-field cron expression interpreted in UTC.
          example: "0 */6 * * *"
        enabled:
          type: boolean
        createdAt:
          type: integer
          format: int64
          description: Unix seconds.
        updatedAt:
          type: integer
          format: int64

    CreateScheduleRequest:
      type: object
      required: [name, cronExpr]
      properties:
        name:
          type: string
        cronExpr:
          type: string
          description: 5-field cron expression interpreted in UTC.
        enabled:
          type: boolean
          description: Defaults to true if omitted.

    UpdateScheduleRequest:
      type: object
      properties:
        name:
          type: string
        cronExpr:
          type: string
        enabled:
          type: boolean

    PaginationMeta:
      type: object
      required: [total, limit, offset]
      properties:
        total:
          type: integer
          format: int64
          description: Total matching rows ignoring limit/offset.
        limit:
          type: integer
        offset:
          type: integer

    PaginatedSchedules:
      allOf:
        - $ref: "#/components/schemas/PaginationMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Schedule" }

    PaginatedScrapeRuns:
      allOf:
        - $ref: "#/components/schemas/PaginationMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/ScrapeRun" }

    Listing:
      type: object
      required: [board, mls, address, firstSeenAt, slug]
      properties:
        board:
          type: integer
        mls:
          type: integer
        address:
          type: string
        currentPrice:
          type: number
          format: double
          nullable: true
        commuteSecondsDowntown:
          type: integer
          nullable: true
          description: Transit commute time in seconds; null until computed.
        firstSeenAt:
          type: integer
          format: int64
          description: Unix seconds.
        slug:
          type: string
          description: Full realtor.ca URL for the listing.

    PriceHistory:
      type: object
      required: [observedAt, price]
      properties:
        observedAt:
          type: integer
          format: int64
          description: Unix seconds.
        price:
          type: number
          format: double

    ListingDetail:
      allOf:
        - $ref: "#/components/schemas/Listing"
        - type: object
          required: [status, priceHistories]
          properties:
            status:
              type: string
              enum: [available, unavailable]
            priceHistories:
              type: array
              items: { $ref: "#/components/schemas/PriceHistory" }

    PaginatedListings:
      allOf:
        - $ref: "#/components/schemas/PaginationMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Listing" }

    TransitComputeResponse:
      type: object
      required: [started, refresh]
      properties:
        started:
          type: boolean
        refresh:
          type: boolean

    TransitComputeOneResponse:
      type: object
      required: [computed]
      properties:
        computed:
          type: boolean
