root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -gcflags='all=-N -l' -o ./tmp/api ./cmd/api"
  bin = "tmp/api"
  full_bin = "dlv exec --accept-multiclient --headless --continue --listen=:2345 --api-version=2 ./tmp/api"
  include_ext = ["go"]
  exclude_dir = ["tmp", "bin", "migrations", "seeds", "docs", ".git", ".github", ".zed", ".claude"]
  delay = 500
  stop_on_error = true
  send_interrupt = true
  kill_delay = "2s"

[log]
  time = true

[misc]
  clean_on_exit = true
