root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/api"
  full_bin = "dlv exec ./tmp/api --listen=127.0.0.1:2345 --headless=true --api-version=2 --accept-multiclient --continue --log --"
  cmd = "go build -gcflags='all=-N -l' -o ./tmp/api ./cmd/api"
  delay = 1000
  exclude_dir = ["tmp", "bin", "vendor", "docs"]
  exclude_regex = ["_test\\.go"]
  include_ext = ["go"]
  include_file = [".env"]
  log = "build-errors.log"
  stop_on_error = true
  send_interrupt = true
  kill_delay = "2s"

[color]
  build = "yellow"
  runner = "green"
  watcher = "cyan"
  main = "magenta"

[log]
  time = true

[screen]
  clear_on_rebuild = true
  keep_scroll = true
