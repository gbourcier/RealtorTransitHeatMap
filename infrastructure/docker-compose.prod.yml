services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: realtor_heatmap_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${DATA_DIR:?DATA_DIR is required}/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/${GHCR_OWNER:-gbourcier}/realtortransitheatmap:${IMAGE_TAG:-main}
    container_name: realtor_heatmap_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HTTP_ADDR: 0.0.0.0:3000
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_ENABLE_SSL: "false"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POLYGON_WKT: ${POLYGON_WKT}
      REALTOR_BASE_URL: ${REALTOR_BASE_URL:-https://api2.realtor.ca}
      PRICE_MIN: ${PRICE_MIN}
      PRICE_MAX: ${PRICE_MAX}
      BED_RANGE: ${BED_RANGE}
      BATH_RANGE: ${BATH_RANGE}
      LAT_MAX: ${LAT_MAX}
      LAT_MIN: ${LAT_MIN}
      LON_MAX: ${LON_MAX}
      LON_MIN: ${LON_MIN}
      MOCK_REALTOR_API: ${MOCK_REALTOR_API:-false}
      TRANSIT_SNAPSHOT: ${TRANSIT_SNAPSHOT:-tue-09}
      TRANSIT_REF_LAT: ${TRANSIT_REF_LAT:-45.5048}
      TRANSIT_REF_LON: ${TRANSIT_REF_LON:--73.5772}
      TRANSIT_REF_KEY: ${TRANSIT_REF_KEY:-mcgill}
      TRANSIT_NEAREST_STOPS: ${TRANSIT_NEAREST_STOPS:-5}
      TRANSIT_WALK_SPEED_MPS: ${TRANSIT_WALK_SPEED_MPS:-1.39}
      TRANSIT_WALK_DETOUR: ${TRANSIT_WALK_DETOUR:-1.3}
    volumes:
      - ${DATA_DIR:?DATA_DIR is required}/gtfs-cache:/app/data/gtfs
    ports:
      - "${API_PORT:-3000}:3000"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
